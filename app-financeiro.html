<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE7 Mobile - Setor Financeiro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK Compat (Mesma versão compatível com a matriz) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

    <!-- TELA DE LOGIN DO FINANCEIRO -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl mb-4 text-2xl font-bold">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">SE7 Financeiro</h1>
                <p class="text-sm text-slate-500 mt-1">Acesso exclusivo para colaboradores do setor</p>
            </div>

            <form id="form-login" onsubmit="realizarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">E-mail Institucional</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="email-login" required 
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition"
                            placeholder="financeiro@se7.com">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Senha</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="senha-login" required 
                            class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm transition"
                            placeholder="••••••••">
                    </div>
                </div>

                <div id="erro-login" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-200 hidden"></div>

                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-colors shadow-md shadow-blue-500/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL DO FINANCEIRO (Oculto até autenticar) -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Header do App -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm text-slate-900 leading-tight">SE7 Financeiro</h2>
                    <span class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Conectado à Matriz
                    </span>
                </div>
            </div>
            <button onclick="realizarLogout()" class="text-slate-500 hover:text-red-600 text-sm font-medium p-2 rounded-lg transition hover:bg-slate-100" title="Sair da Conta">
                <i class="fa-solid fa-power-off text-base"></i>
            </button>
        </header>

        <!-- Conteúdo Principal Dinâmico -->
        <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-4">
            <!-- Barra de Busca de Alunos / Faturas -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Localizar Aluno / Mensalidade</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="busca-aluno" oninput="filtrarAlunos(this.value)"
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                        placeholder="Digite o nome do aluno ou CPF...">
                </div>
            </div>

            <!-- Lista de Faturas / Alunos -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-xs uppercase tracking-wider text-slate-600">Faturas e Parcelas Recentes</h3>
                    <span id="contador-faturas" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">0 registros</span>
                </div>
                <div id="lista-faturas-container" class="divide-y divide-slate-100">
                    <!-- Os itens serão injetados dinamicamente via script -->
                    <div class="p-6 text-center text-slate-400 text-sm">
                        Carregando dados sincronizados com a matriz...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SCRIPT DE CONEXÃO, AUTENTICAÇÃO E LÓGICA DO APP -->
    <script>
        // =========================================================================
        // ATENÇÃO: Garanta que este objeto é IDÊNTICO ao configurado na sua Matriz
        // =========================================================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_DA_MATRIZ",
            authDomain: "SEU_AUTH_DOMAIN_DA_MATRIZ",
            projectId: "SEU_PROJECT_ID_DA_MATRIZ",
            storageBucket: "SEU_STORAGE_BUCKET_DA_MATRIZ",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID_DA_MATRIZ",
            appId: "SEU_APP_ID_DA_MATRIZ"
        };

        // Inicializa o Firebase com segurança
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        // Escuta em tempo real o estado da sessão conectado com a matriz
        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app-screen');

            if (user) {
                // Usuário autenticado com sucesso
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                carregarDadosFinanceiros(); // Carrega as faturas do Firestore da matriz
            } else {
                // Sem sessão ativa
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Função de Login integrada
        async function realizarLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-login').value;
            const senha = document.getElementById('senha-login').value;
            const erroDiv = document.getElementById('erro-login');

            erroDiv.classList.add('hidden');

            try {
                await auth.signInWithEmailAndPassword(email, senha);
                // O evento onAuthStateChanged cuidará de transicionar a tela automaticamente
            } catch (error) {
                console.error("Erro detalhado no login:", error);
                let mensagemErro = "Falha no acesso. Verifique suas credenciais.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    mensagemErro = "E-mail ou senha incorretos.";
                } else if (error.code === 'auth/too-many-requests') {
                    mensagemErro = "Muitas tentativas falhas. Tente novamente mais tarde.";
                }
                erroDiv.textContent = mensagemErro;
                erroDiv.classList.remove('hidden');
            }
        }

        // Função de Logout
        function realizarLogout() {
            auth.signOut().catch((error) => {
                console.error("Erro ao sair:", error);
            });
        }

        // Função para carregar dados do financeiro integrados com a base matriz
        function carregarDadosFinanceiros() {
            const container = document.getElementById('lista-faturas-container');
            
            // Exemplo de busca no Firestore da matriz (ajuste o nome da coleção se necessário, ex: 'faturas' ou 'mensalidades')
            db.collection("faturas").limit(20).get().then((querySnapshot) => {
                let html = '';
                let count = 0;

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">Nenhuma fatura encontrada na base da matriz.</div>`;
                    document.getElementById('contador-faturas').textContent = '0 registros';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    count++;
                    const data = doc.data();
                    html += `
                        <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                            <div>
                                <h4 class="font-semibold text-sm text-slate-900">${data.nomeAluno || 'Aluno não identificado'}</h4>
                                <p class="text-xs text-slate-500">Vencimento: ${data.vencimento || 'N/A'} • Valor: R$ ${data.valor || '0,00'}</p>
                            </div>
                            <span class="px-2.5 py-1 text-xs font-medium rounded-full ${data.status === 'Pago' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${data.status || 'Pendente'}
                            </span>
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('contador-faturas').textContent = `${count} registros`;
            }).catch((error) => {
                console.error("Erro ao buscar faturas:", error);
                container.innerHTML = `<div class="p-6 text-center text-red-500 text-sm">Erro ao sincronizar dados com o servidor da matriz.</div>`;
            });
        }

        // Filtro local da listagem de alunos
        function filtrarAlunos(termo) {
            // Implementação de busca rápida na listagem carregada
        }
    </script>
</body>
</html>
