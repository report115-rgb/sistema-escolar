<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Financeiro - Gestão de Mensalidades</title>
    <!-- Tailwind CSS para Estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-wallet mr-2"></i> App Financeiro - Gestão de Alunos</h1>
        <span class="text-xs bg-indigo-800 px-3 py-1 rounded-full font-semibold">Módulo Financeiro</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- Barra de Busca de Alunos -->
        <div class="bg-white dark:bg-slate-900 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex gap-2">
            <input type="text" id="input-busca-aluno" placeholder="Digite o nome do aluno..." class="flex-1 px-4 py-2 border rounded-lg dark:bg-slate-800 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button onclick="buscarAlunoFinanceiro()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm transition">
                <i class="fa-solid fa-search mr-1"></i> Buscar
            </button>
        </div>

        <!-- Seção de Cobranças do Aluno Selecionado -->
        <div id="painel-cobrancas" class="bg-white dark:bg-slate-900 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="border-b pb-3 border-slate-200 dark:border-slate-800 flex justify-between items-center">
                <h2 class="text-lg font-bold" id="nome-aluno-selecionado">Selecione um aluno para gerenciar as mensalidades</h2>
                <span id="status-aluno-badge" class="text-xs px-2.5 py-1 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">Nenhum aluno</span>
            </div>

            <!-- Lista Dinâmica de Cobranças -->
            <div id="lista-cobrancas-container" class="space-y-3">
                <p class="text-sm text-slate-400 italic text-center py-6">Nenhum registro carregado no momento.</p>
            </div>
        </div>

    </main>

    <!-- Script de Lógica do Sistema -->
    <script>
        // Banco de dados simulado local (Substitua ou integre com sua API/LocalStorage real)
        let dbCobrancas = [
            { id: 'c1', alunoId: 'a1', nomeAluno: 'Maria Silva', descricao: 'Mensalidade 01 - Janeiro', vencimento: '2026-01-10', valor: 350.00, status: 'Pendente', formaPagamento: '', dataPagamento: '' },
            { id: 'c2', alunoId: 'a1', nomeAluno: 'Maria Silva', descricao: 'Mensalidade 02 - Fevereiro', vencimento: '2026-02-10', valor: 350.00, status: 'Pendente', formaPagamento: '', dataPagamento: '' }
        ];

        let alunoAtualId = 'a1';

        function buscarAlunoFinanceiro() {
            let termo = document.getElementById('input-busca-aluno').value.toLowerCase();
            let cobrancaEncontrada = dbCobrancas.find(c => c.nomeAluno.toLowerCase().includes(termo));
            
            if (cobrancaEncontrada) {
                alunoAtualId = cobrancaEncontrada.alunoId;
                document.getElementById('nome-aluno-selecionado').innerText = `Aluno: ${cobrancaEncontrada.nomeAluno}`;
                document.getElementById('status-aluno-badge').className = "text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-semibold";
                document.getElementById('status-aluno-badge').innerText = "Ativo";
                renderizarCobrancasAlunoSelecionadoFinanceiro(alunoAtualId);
            } else {
                alert("Nenhum aluno encontrado com esse nome.");
            }
        }

        function renderizarCobrancasAlunoSelecionadoFinanceiro(alunoId) {
            let container = document.getElementById('lista-cobrancas-container');
            let cobrancasDoAluno = dbCobrancas.filter(c => c.alunoId === alunoId);

            if (cobrancasDoAluno.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400 italic text-center py-6">Nenhuma cobrança encontrada para este aluno.</p>`;
                return;
            }

            let html = '';
            cobrancasDoAluno.forEach(cobranca => {
                html += `
                    <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700 space-y-3">
                        <div class="flex justify-between items-center flex-wrap gap-2">
                            <div>
                                <span class="font-bold text-sm text-slate-800 dark:text-white">${cobranca.descricao}</span>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Vencimento: ${cobranca.vencimento} | Valor: R$ ${cobranca.valor.toFixed(2)}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${cobranca.status === 'Pago' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                    ${cobranca.status}
                                </span>
                                <!-- Botão Editar Mensalidade (Data e Valor) -->
                                <button type="button" onclick="abrirModalEditarMensalidadeFinanceiro('${cobranca.id}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold shadow transition">
                                    <i class="fa-solid fa-pen-to-square mr-1"></i> Editar
                                </button>
                            </div>
                        </div>

                        <!-- Seção de Baixa com Forma de Pagamento e Data Personalizada -->
                        ${cobranca.status !== 'Pago' ? `
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 pt-2 border-t border-slate-200 dark:border-slate-700 items-center">
                                <div>
                                    <label class="block text-[10px] font-semibold uppercase text-slate-500 mb-1">Forma de Pagamento</label>
                                    <select id="forma-pagamento-${cobranca.id}" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-xs bg-white dark:bg-slate-800">
                                        <option value="Dinheiro">Dinheiro</option>
                                        <option value="Pix">Pix</option>
                                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                                        <option value="Cartão de Débito">Cartão de Débito</option>
                                        <option value="Boleto">Boleto</option>
                                        <option value="Transferência">Transferência</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-semibold uppercase text-slate-500 mb-1">Data do Pagamento</label>
                                    <input type="date" id="data-pagamento-${cobranca.id}" value="${new Date().toISOString().split('T')[0]}" class="w-full px-2 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-xs bg-white dark:bg-slate-800">
                                </div>
                                <div class="flex items-end h-full pt-4 md:pt-0">
                                    <button type="button" onclick="darBaixaMensalidadeFinanceiro('${cobranca.id}')" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow transition">
                                        <i class="fa-solid fa-check mr-1"></i> Dar Baixa
                                    </button>
                                </div>
                            </div>
                        ` : `
                            <div class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold pt-1">
                                <i class="fa-solid fa-circle-check mr-1"></i> Pago em ${cobranca.dataPagamento \vert{}\vert{} '---'} via${cobranca.formaPagamento || '---'}
                            </div>
                        `}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Função de Edição de Vencimento e Valor[cite: 1]
        function abrirModalEditarMensalidadeFinanceiro(cobrancaId) {
            let cobranca = dbCobrancas.find(c => c.id === cobrancaId);
            if (!cobranca) return;

            let novoVencimento = prompt("Digite a nova data de vencimento (AAAA-MM-DD):", cobranca.vencimento);
            if (!novoVencimento) return;
            
            let novoValor = prompt("Digite o novo valor da mensalidade (R$):", cobranca.valor);
            if (!novoValor) return;

            cobranca.vencimento = novoVencimento;
            cobranca.valor = parseFloat(novoValor.replace(',', '.'));
            
            alert("Mensalidade atualizada com sucesso!");
            renderizarCobrancasAlunoSelecionadoFinanceiro(cobranca.alunoId);
        }

        // Função para Efetivar a Baixa Financeira[cite: 1]
        function darBaixaMensalidadeFinanceiro(cobrancaId) {
            let formaPagamentoSelect = document.getElementById(`forma-pagamento-${cobrancaId}`);
            let dataPagamentoInput = document.getElementById(`data-pagamento-${cobrancaId}`);

            let formaPagamento = formaPagamentoSelect ? formaPagamentoSelect.value : "Dinheiro";
            let dataPagamento = dataPagamentoInput ? dataPagamentoInput.value : new Date().toISOString().split('T')[0];

            let cobranca = dbCobrancas.find(c => c.id === cobrancaId);
            if (cobranca) {
                cobranca.status = 'Pago';
                cobranca.formaPagamento = formaPagamento;
                cobranca.dataPagamento = dataPagamento;

                alert(`Baixa efetuada com sucesso via ${formaPagamento} em ${dataPagamento}!`);
                renderizarCobrancasAlunoSelecionadoFinanceiro(cobranca.alunoId);
            }
        }

        // Inicializa com o primeiro aluno de exemplo na tela
        window.onload = function() {
            renderizarCobrancasAlunoSelecionadoFinanceiro(alunoAtualId);
        };
    </script>
</body>
</html>
