<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Validar acordo financeiro — SE7</title><style>body{background:#eef3f9;font:15px/1.6 Arial;margin:0;color:#1e293b}main{max-width:680px;margin:35px auto;padding:30px;background:white;border-radius:15px;box-shadow:0 10px 30px #17345a22}h1{color:#123f75;font-size:22px}dt{font-weight:bold;margin-top:12px}dd{margin:0}#status{padding:12px;border-radius:8px;background:#edf5fa}.valid{background:#dcfce7!important;color:#166534}.invalid{background:#fee2e2!important;color:#991b1b}@media(max-width:720px){main{margin:12px;padding:20px}}</style></head><body><main><h1>SE7 — Validação de acordo financeiro</h1><p id="status">Consultando registro oficial...</p><dl id="details"></dl><p><small>A validação confirma a existência do registro institucional do acordo, não substitui assinatura digital certificada. Compare as informações com o documento.</small></p></main><script>
(async()=>{const status=document.getElementById('status'),details=document.getElementById('details');try{const token=location.hash.slice(1);if(!/^[a-f0-9]{48}$/.test(token))throw Error('Código inválido.');const response=await fetch('/api/se7',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'financial-agreement-verify',token})});const data=await response.json();if(!response.ok)throw Error(data.error||'Consulta indisponível');status.textContent=data.valid?'Registro institucional válido':data.found?'Documento não válido ou revogado':'Documento não localizado';status.className=data.valid?'valid':'invalid';if(data.found){for(const [k,v]of [['Documento',data.title],['Instituição',data.institutionName],['CNPJ',data.institutionCNPJ],['Aluno(a)',data.studentName],['Matrícula',data.studentCode],['Valor negociado',Number(data.amountCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})],['Quantidade de pagamentos',data.count],['Data do aceite',data.acceptedAt?new Date(data.acceptedAt).toLocaleDateString('pt-BR'):'Não informada'],['Código de validação',data.code]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=String(v??'');details.append(dt,dd);}}}catch(e){status.textContent='Não foi possível validar: '+e.message;status.className='invalid';}})();</script></body></html>
