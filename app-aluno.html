<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SE7 - Portal do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <div id="login-screen" class="fixed inset-0 z-50 bg-gradient-to-br from-blue-900 to-indigo-950 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 space-y-6 text-slate-800">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600 text-white rounded-2xl text-xl font-bold shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-xl font-black text-slate-900">Portal do Aluno - SE7</h1>
                <p class="text-xs text-slate-500">Acesse com seu CPF cadastrado</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">CPF do Aluno</label>
                    <input type="text" id="login-cpf" placeholder="000.000.000-00" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                <button onclick="fazerLoginAluno()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition text-sm">
                    Entrar no Portal
                </button>
            </div>
        </div>
    </div>

    <div id="main-app" class="flex-1 flex flex-col hidden">
        <header class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-40">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 bg-white/10 rounded-xl flex items-center justify-center font-bold text-xs">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div>
                    <h2 class="font-bold text-xs" id="header-aluno-nome">Nome do Aluno</h2>
                    <span class="text-[10px] text-blue-100" id="header-aluno-curso">Curso</span>
                </div>
            </div>
            <button onclick="fazerLogoutAluno()" class="px-2.5 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold shadow transition">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </header>

        <main class="flex-1 p-4 pb-20 max-w-md w-full mx-auto space-y-4">
            
            <div id="tab-documentos" class="space-y-3" style="display: none;">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-900 mb-1"><i class="fa-solid fa-folder-open text-blue-600 mr-1.5"></i> Documentos de Matrícula</h3>
                    <p class="text-[11px] text-slate-500">Envie seus documentos em PDF. Sem limite de tamanho!</p>
                </div>
                <div id="lista-documentos-aluno" class="space-y-3">
                    </div>
            </div>

            <div id="tab-home" class="space-y-4">
                <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 rounded-3xl text-white shadow-xl space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-widest bg-white/20 px-2 py-0.5 rounded-full">Carteirinha Digital</span>
                            <h3 class="font-bold text-base mt-2" id="card-nome">---</h3>
                            <p class="text-xs text-blue-100">Matrícula: <span id="card-matricula">---</span></p>
                        </div>
                        <div id="card-qrcode" class="bg-white p-1 rounded-xl"></div>
                    </div>
                </div>
            </div>

        </main>

        <nav class="bg-white border-t border-slate-200 px-4 py-2 flex justify-around items-center fixed bottom-0 left-0 right-0 z-40 shadow-lg">
            <button onclick="mudarAba('home')" id="nav-home" class="flex flex-col items-center text-blue-600 text-[10px] font-bold transition">
                <i class="fa-solid fa-house text-lg mb-0.5"></i> Início
            </button>
            <button onclick="mudarAba('documentos')" id="nav-documentos" class="flex flex-col items-center text-slate-400 text-[10px] font-bold transition">
                <i class="fa-solid fa-file-arrow-up text-lg mb-0.5"></i> Documentos
            </button>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeJ-fqzwiQt0PZEKQ6e8zAPSuh7WRuaHo",
            authDomain: "sistema-escolar-nuvem.firebaseapp.com",
            projectId: "sistema-escolar-nuvem",
            storageBucket: "sistema-escolar-nuvem.firebasestorage.app",
            messagingSenderId: "343442411308",
            appId: "1:343442411308:web:e4500b862fa29b6b326689"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let alunoLogado = null;
        let configInstituicao = {};

        const tiposDocumentosObrigatorios = [
            { id: "rg_cnh", label: "RG ou CNH" },
            { id: "cpf", label: "CPF" },
            { id: "comprovante_residencia", label: "Comprovante de Residência" },
            { id: "certidao_nasc_cas", label: "Certidão de Nascimento ou Casamento" },
            { id: "diploma_medio", label: "Diploma do Ensino Médio" },
            { id: "historico_medio", label: "Histórico do Ensino Médio" }
        ];

        window.addEventListener('DOMContentLoaded', async () => {
            const sessao = sessionStorage.getItem('aluno_app_logado');
            if(sessao) {
                alunoLogado = JSON.parse(sessao);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                await carregarConfiguracaoInstituicao();
                atualizarInterfaceAluno();
            }
        });

        async function carregarConfiguracaoInstituicao() {
            try {
                const doc = await db.collection("config").doc("institution").get();
                if(doc.exists) configInstituicao = doc.data();
            } catch(e) {
                console.error("Erro ao carregar config:", e);
            }
        }

        async function fazerLoginAluno() {
            let cpf = document.getElementById('login-cpf').value.trim();
            if(!cpf) return alert("Digite seu CPF.");
            cpf = cpf.replace(/\D/g, '');

            try {
                const snap = await db.collection("students").get();
                let encontrado = null;
                snap.forEach(doc => {
                    const data = doc.data();
                    const cpfLimpo = (data.cpf || '').replace(/\D/g, '');
                    if(cpfLimpo === cpf) {
                        encontrado = { id: doc.id, ...data };
                    }
                });

                if(encontrado) {
                    alunoLogado = encontrado;
                    sessionStorage.setItem('aluno_app_logado', JSON.stringify(alunoLogado));
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    await carregarConfiguracaoInstituicao();
                    atualizarInterfaceAluno();
                } else {
                    alert("Aluno não encontrado com este CPF.");
                }
            } catch(e) {
                alert("Erro ao realizar login: " + e.message);
            }
        }

        function fazerLogoutAluno() {
            sessionStorage.removeItem('aluno_app_logado');
            location.reload();
        }

        function mudarAba(aba) {
            ['home', 'documentos'].forEach(a => {
                const el = document.getElementById(`tab-${a}`);
                const btn = document.getElementById(`nav-${a}`);
                if(el) el.style.display = (a === aba) ? 'block' : 'none';
                if(btn) {
                    btn.className = (a === aba) 
                        ? 'flex flex-col items-center text-blue-600 text-[10px] font-bold transition' 
                        : 'flex flex-col items-center text-slate-400 text-[10px] font-bold transition';
                }
            });
        }

        function atualizarInterfaceAluno() {
            document.getElementById('header-aluno-nome').textContent = alunoLogado.fullname || 'Aluno';
            document.getElementById('header-aluno-curso').textContent = alunoLogado.courseName || 'Curso Técnico';
            document.getElementById('card-nome').textContent = alunoLogado.fullname || '';
            document.getElementById('card-matricula').textContent = alunoLogado.code || '---';

            const qr = document.getElementById('card-qrcode');
            qr.innerHTML = '';
            new QRCode(qr, { text: `SE7-ALUNO-${alunoLogado.code || alunoLogado.id}`, width: 45, height: 45 });

            renderizarUploadDocumentosAluno();
        }

        function renderizarUploadDocumentosAluno() {
            const container = document.getElementById('lista-documentos-aluno');
            container.innerHTML = '';
            const docs = alunoLogado.documentos || {};

            tiposDocumentosObrigatorios.forEach(tipo => {
                const d = docs[tipo.id] || {};
                const status = d.status || 'Pendente';
                const link = d.driveUrl || d.fileUrl || '';

                let badge = `<span class="px-2 py-0.5 bg-slate-200 text-slate-700 rounded text-[10px] font-bold">Pendente</span>`;
                if(status === 'Aprovado') badge = `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded text-[10px] font-bold">Aprovado</span>`;
                if(status === 'Reprovado') badge = `<span class="px-2 py-0.5 bg-red-100 text-red-800 rounded text-[10px] font-bold">Reprovado</span>`;

                container.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 space-y-2 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-800">${tipo.label}</span>
                            <div>${badge}</div>
                        </div>
                        ${link ? `<p><a href="${link}" target="_blank" class="text-blue-600 underline font-semibold"><i class="fa-solid fa-file-pdf mr-1"></i> Ver Documento Enviado</a></p>` : '<p class="text-slate-400 text-[11px]">Nenhum arquivo enviado</p>'}
                        <div class="flex items-center gap-2 pt-1">
                            <input type="file" id="file_doc_${tipo.id}" accept="application/pdf" class="text-[10px] w-full border border-slate-200 p-1 rounded bg-slate-50">
                            <button onclick="enviarDocumentoPDFAluno('${tipo.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-[10px] shrink-0 shadow">Enviar</button>
                        </div>
                        ${d.motivoReprovacao ? `<p class="text-[11px] text-red-600 font-semibold bg-red-50 p-2 rounded">Motivo da Reprovação: ${d.motivoReprovacao}</p>` : ''}
                    </div>
                `;
            });
        }

        // FUNÇÃO ATUALIZADA: ENVIA DIRETAMENTE PARA O GOOGLE DRIVE DA INSTITUIÇÃO SEM LIMITE DE TAMANHO
        async function enviarDocumentoPDFAluno(tipoId) {
            const fileInput = document.getElementById(`file_doc_${tipoId}`);
            if(!fileInput || !fileInput.files || fileInput.files.length === 0) return alert("Selecione um arquivo PDF.");
            const file = fileInput.files[0];
            
            if(file.type !== "application/pdf") {
                return alert("Atenção: O documento precisa obrigatoriamente estar em formato PDF.");
            }

            if(!configInstituicao.gdriveUrl) {
                return alert("Atenção: A instituição ainda não configurou o sistema de envio para o Google Drive. Avise a secretaria.");
            }

            const btnEnvio = event.target;
            const textoOriginal = btnEnvio.innerHTML;
            btnEnvio.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            btnEnvio.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1];
                
                try {
                    // Envia para o Google Drive via Apps Script Webhook (Sem limite de 1MB!)
                    const response = await fetch(configInstituicao.gdriveUrl, {
                        method: "POST",
                        body: JSON.stringify({
                            filename: `${alunoLogado.fullname}_${tipoId}.pdf`,
                            mimeType: "application/pdf",
                            fileData: base64Data,
                            folder: "Documentos Alunos SE7"
                        })
                    });
                    const resJson = await response.json();
                    const driveFileUrl = resJson.url || "";

                    if(!alunoLogado.documentos) alunoLogado.documentos = {};
                    alunoLogado.documentos[tipoId] = {
                        status: "Pendente",
                        motivoReprovacao: "",
                        fileUrl: driveFileUrl,
                        fileName: file.name,
                        driveUrl: driveFileUrl
                    };

                    // Salva apenas os metadados e o link do Drive
